<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hubcode - Repository Manager</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { 
            --bg: #1e1e22; 
            --card-bg: #1e1e22; 
            --shadow-dark: #111113; 
            --shadow-light: #2b2b31; 
            --accent: #ffca28; 
            --text: #c9d1d9; 
            --danger: #f85149; 
            --success: #7ee787; 
            --blue: #58a6ff;
            --orange: #ffa726;
        }
        
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, system-ui, sans-serif; 
            padding: 15px; 
            margin: 0;
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }
        
        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light); 
            border: none; 
            margin-bottom: 20px; 
        }
        
        h2 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); margin-top: 0; }
        
        input { 
            width: 100%; 
            margin: 8px 0; 
            padding: 14px; 
            border-radius: 12px; 
            border: none; 
            background: var(--bg); 
            color: white; 
            box-sizing: border-box; 
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light); 
            outline: none;
            font-size: 13px;
        }

        .search-box {
            margin: 12px 0 4px 0;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            left: 20px; 
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 9999;
            pointer-events: none; 
        }

        @media (min-width: 440px) {
            .toast-container {
                left: auto;
                width: 360px;
            }
        }

        .internal-toast {
            pointer-events: auto; 
            background: linear-gradient(135deg, #16161a, #111113);
            border-left: 4px solid var(--accent);
            border-radius: 8px;
            padding: 14px;
            font-size: 12px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), inset 2px 2px 4px var(--shadow-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .internal-toast.success-toast { border-left-color: var(--success); }
        .internal-toast.danger-toast { border-left-color: var(--danger); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        button.btn { 
            width: 100%; 
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid rgba(255, 255, 255, 0.05); 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 8px; 
            transition: all 0.1s ease; 
            background: linear-gradient(135deg, #2b2b31, #1b1b1f); 
            box-shadow: 4px 4px 8px var(--shadow-dark), 
                        -4px -4px 8px var(--shadow-light),
                        inset 1px 1px 1px rgba(255, 255, 255, 0.1); 
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }
        
        button.btn:active { 
            box-shadow: inset 3px 3px 6px var(--shadow-dark), 
                        inset -3px -3px 6px var(--shadow-light); 
            transform: translateY(1px); 
        }
        
        .yellow-btn { color: var(--accent); border-bottom: 2px solid rgba(255, 202, 40, 0.2) !important; }
        .red-btn { color: var(--danger); border-bottom: 2px solid rgba(248, 81, 73, 0.2) !important; }
        
        .repo-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .repo-item {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 14px;
            box-shadow: 4px 4px 8px var(--shadow-dark), -2px -2px 6px var(--shadow-light);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .repo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 0.9rem;
            color: #fff;
        }
        
        .repo-actions-row {
            display: flex;
            gap: 4px;
            width: 100%;
            padding-bottom: 4px;
        }
        
        .action-btn {
            flex: 1;
            min-width: 0; 
            padding: 11px 2px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background: linear-gradient(135deg, #26262b, #16161a);
            color: var(--text);
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 2px 2px 4px var(--shadow-dark), 
                        -1px -1px 2px var(--shadow-light),
                        inset 1px 1px 0px rgba(255, 255, 255, 0.05);
            text-align: center;
            transition: all 0.05s ease;
        }
        
        .action-btn:active {
            box-shadow: inset 2px 2px 4px var(--shadow-dark);
            transform: translateY(1px);
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            transform: none;
            cursor: not-allowed;
            filter: grayscale(0.1);
        }

        .btn-html { color: var(--blue); border-bottom: 2px solid rgba(88, 166, 255, 0.3); }
        .btn-json { color: var(--accent); border-bottom: 2px solid rgba(255, 202, 40, 0.3); }
        .btn-sw { color: var(--success); border-bottom: 2px solid rgba(126, 231, 135, 0.3); }
        .btn-view { color: #fff; background: linear-gradient(135deg, #4a4a54, #2a2a30); border-bottom: 2px solid rgba(255, 255, 255, 0.2); }
        .btn-back { color: var(--orange); border-bottom: 2px solid rgba(255, 167, 38, 0.3); }
        .btn-sup { color: var(--danger); border-bottom: 2px solid rgba(248, 81, 73, 0.3); }
        
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .dot-idle { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .dot-active { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: blink 0.8s infinite alternate; }
        
        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
        
        .confirm-panel {
            background: #1a1a1d;
            border: 1px solid var(--danger);
            border-radius: 12px;
            padding: 12px;
            margin-top: 8px;
            display: none;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            font-size: 12px;
        }
        
        .confirm-buttons {
            display: flex;
            gap: 10px;
        }
        
        .confirm-btn {
            flex: 1;
            padding: 10px;
            border: 1px solid rgba(0, 0, 0, 0.2);
            border-radius: 7px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            box-shadow: 2px 2px 4px var(--shadow-dark), inset 1px 1px 0px rgba(255, 255, 255, 0.1);
            transition: all 0.05s ease;
        }

        .confirm-btn:active {
            box-shadow: inset 2px 2px 4px rgba(0, 0, 0, 0.5);
            transform: translateY(1px);
        }

        /* Tracker Terminal */
        .tracker-terminal {
            background: #0a0c10;
            border-radius: 12px;
            margin-top: 12px;
            padding: 10px;
            font-family: 'SF Mono', 'Monaco', monospace;
            font-size: 10px;
            border: 1px solid rgba(255, 202, 40, 0.25);
            box-shadow: inset 0 0 8px rgba(0,0,0,0.6);
            color: #c0c0d0;
            display: none;
            flex-direction: column;
            gap: 4px;
            max-height: 260px;
            overflow-y: auto;
        }

        .tracker-header {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #2a2a32;
            padding-bottom: 4px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 9px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .log-line {
            padding: 3px 4px;
            border-radius: 5px;
            background: #111217;
            word-break: break-word;
            font-size: 10px;
            font-family: monospace;
            border-left: 2px solid transparent;
        }

        .log-success { color: var(--success); border-left-color: var(--success); }
        .log-error { color: var(--danger); border-left-color: var(--danger); }
        .log-step { color: var(--blue); border-left-color: var(--blue); }
        .log-warning { color: var(--orange); border-left-color: var(--orange); }

        .spinner-small {
            display: inline-block;
            width: 9px;
            height: 9px;
            border: 1.5px solid rgba(255,202,40,0.3);
            border-top: 1.5px solid var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .signature {
            text-align: center;
            font-size: 11px;
            color: #555;
            margin-top: auto;
            padding-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>

<body>
    <div id="toastContainer" class="toast-container"></div>

    <div class="card">
        <h2>Hubcode</h2>
        <input type="password" id="githubToken" placeholder="Token GitHub (accès repo + delete_repo)">
        <button class="btn yellow-btn" onclick="playHum60Hz(); fetchRepositories()">🔄 CHARGER LES DÉPÔTS</button>
    </div>

    <div class="card" style="flex: 1;">
        <div style="display: flex; justify-content: space-between;">
            <span style="font-size:0.75rem; text-transform:uppercase; color:#888;">Projets</span>
            <div style="display: flex; align-items: center; gap: 6px; font-size: 11px;">
                <span class="status-dot dot-idle" id="globalStatus"></span> <span id="statusText">PRÊT</span>
            </div>
        </div>
        <input type="text" id="repoSearch" class="search-box" placeholder="🔍 Rechercher..." oninput="filterRepositories()">
        <div class="repo-list" id="repoListContainer"></div>
    </div>
    <div class="signature">Made by Brahim Laiche 2026 Paris</div>

<script>
    let allRepositories = [];
    let audioCtx = null;

    // Conversions UTF-8 <-> base64 fiables
    function base64ToUtf8(base64) {
        const raw = atob(base64.replace(/\s/g, ''));
        return decodeURIComponent(escape(raw));
    }

    function utf8ToBase64(utf8Str) {
        return btoa(unescape(encodeURIComponent(utf8Str)));
    }

    function playHum60Hz() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.value = 60;
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        } catch(e) { console.warn(e); }
    }

    function showNotification(msg, type='success') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `internal-toast ${type}-toast`;
        toast.innerText = msg;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px) scale(0.95)';
            setTimeout(() => toast.remove(), 250);
        }, 3500);
    }

    window.onload = () => {
        const saved = localStorage.getItem('hubcode_token');
        if (saved) document.getElementById('githubToken').value = saved;
    };

    function setActivityState(active, msg="") {
        const dot = document.getElementById('globalStatus');
        const text = document.getElementById('statusText');
        if(active) {
            dot.className = "status-dot dot-active";
            text.innerText = msg || "TRAITEMENT...";
            text.style.color = "var(--accent)";
        } else {
            dot.className = "status-dot dot-idle";
            text.innerText = "PRÊT";
            text.style.color = "#666";
        }
    }

    async function fetchRepositories() {
        const token = document.getElementById('githubToken').value.trim();
        if(!token) { showNotification("Token requis", "danger"); return; }
        localStorage.setItem('hubcode_token', token);
        setActivityState(true, "CHARGEMENT REPOS");
        try {
            const resp = await fetch('https://api.github.com/user/repos?per_page=100&sort=updated', {
                headers: { 'Authorization': `token ${token}` }
            });
            if(!resp.ok) throw new Error(`Erreur ${resp.status}`);
            allRepositories = await resp.json();
            document.getElementById('repoSearch').value = "";
            renderRepos(allRepositories);
        } catch(err) {
            showNotification(err.message, "danger");
        } finally {
            setActivityState(false);
        }
    }

    function filterRepositories() {
        const q = document.getElementById('repoSearch').value.toLowerCase();
        const filtered = allRepositories.filter(r => r.name.toLowerCase().includes(q));
        renderRepos(filtered);
    }

    // TRACKER
    function getTracker(repoName) {
        let el = document.getElementById(`tracker-${repoName}`);
        if (!el) {
            const repoDiv = document.getElementById(`repo-${repoName}`);
            if (repoDiv) {
                const newTracker = document.createElement('div');
                newTracker.id = `tracker-${repoName}`;
                newTracker.className = 'tracker-terminal';
                newTracker.innerHTML = `<div class="tracker-header"><span>⛁ ROLLBACK LOGS</span><span>⚡ temps réel</span></div>`;
                repoDiv.appendChild(newTracker);
                el = newTracker;
            }
        }
        return el;
    }

    function showTracker(repoName) {
        const t = getTracker(repoName);
        if (t) t.style.display = "flex";
    }

    function clearTracker(repoName) {
        const t = getTracker(repoName);
        if (t) {
            t.innerHTML = `<div class="tracker-header"><span>⛁ ROLLBACK LOGS</span><span>⚡ temps réel</span></div>`;
            t.style.display = "flex";
        }
    }

    function addTrackerLog(repoName, message, status = "step") {
        const t = getTracker(repoName);
        if (!t) return;
        const line = document.createElement('div');
        line.className = `log-line log-${status === 'error' ? 'error' : (status === 'success' ? 'success' : (status === 'warning' ? 'warning' : 'step'))}`;
        const time = new Date().toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit', second:'2-digit' });
        let symbol = "•";
        if (status === 'success') symbol = "✓";
        else if (status === 'error') symbol = "✗";
        else if (status === 'step') symbol = "▶";
        else if (status === 'loading') symbol = "⟳";
        line.innerHTML = `<span style="color:#888;">[${time}]</span> ${symbol} ${message}`;
        if (status === 'loading') {
            const spinner = document.createElement('span');
            spinner.className = "spinner-small";
            line.appendChild(spinner);
        }
        t.appendChild(line);
        t.scrollTop = t.scrollHeight;
    }

    function setBackButtonState(repoName, disabled) {
        const btn = document.querySelector(`#repo-${repoName} .action-btn.btn-back`);
        if (btn) btn.disabled = disabled;
    }

    // ========== ROLLBACK AVEC VÉRIFICATION DE CHANGEMENT EFFECTIF ==========
    async function revertToPreviousCommit(owner, repo, defaultBranch) {
        const token = localStorage.getItem('hubcode_token');
        if (!token) { showNotification("Token manquant", "danger"); return; }

        clearTracker(repo);
        showTracker(repo);
        setBackButtonState(repo, true);
        setActivityState(true, `ROLLBACK ${repo}`);
        addTrackerLog(repo, `Début du rollback pour ${owner}/${repo} (branche ${defaultBranch})`, "step");

        try {
            // 1. Récupérer les 2 derniers commits
            addTrackerLog(repo, "Récupération des 2 derniers commits...", "loading");
            const commitsResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?per_page=2`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!commitsResp.ok) throw new Error(`HTTP ${commitsResp.status}`);
            const commits = await commitsResp.json();
            if (commits.length < 2) throw new Error("Aucun commit antérieur (moins de 2 commits)");
            const targetSha = commits[1].sha;
            addTrackerLog(repo, `Commit cible (n-1) : ${targetSha.substring(0,7)}`, "success");

            // 2. Extraire index.html du commit précédent (contenu brut)
            addTrackerLog(repo, "Extraction de l'ancien index.html...", "loading");
            const fileResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html?ref=${targetSha}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!fileResp.ok) throw new Error("index.html introuvable dans l'ancien commit");
            const fileData = await fileResp.json();
            const oldBase64 = fileData.content;
            const oldContent = base64ToUtf8(oldBase64);
            addTrackerLog(repo, `Ancien contenu (début) : ${oldContent.substring(0, 100)}...`, "success");

            // 3. Récupérer le contenu actuel (branche par défaut)
            addTrackerLog(repo, "Récupération du contenu actuel...", "loading");
            const currentFileResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html?ref=${defaultBranch}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!currentFileResp.ok) throw new Error("Impossible de récupérer la version actuelle");
            const currentFile = await currentFileResp.json();
            const currentSha = currentFile.sha;
            const currentContent = base64ToUtf8(currentFile.content);
            
            // 4. COMPARAISON : si les contenus sont identiques, pas besoin de rollback
            if (currentContent === oldContent) {
                addTrackerLog(repo, "⚠️ Le commit cible a le même contenu que la version actuelle. Aucun changement nécessaire.", "warning");
                addTrackerLog(repo, "Rien n'a été modifié sur le dépôt.", "step");
                showNotification("Le commit précédent est identique à la version actuelle. Rollback inutile.", "warning");
                return;
            }
            addTrackerLog(repo, "Les contenus sont différents → rollback nécessaire.", "success");

            // 5. Préparer le nouveau base64 (propre)
            const cleanBase64 = utf8ToBase64(oldContent);
            
            // 6. Injection du commit de restauration
            addTrackerLog(repo, "Injection du commit de restauration...", "loading");
            const putResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html`, {
                method: 'PUT',
                headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    message: "↩️ Rollback: restauration de l'état précédent",
                    content: cleanBase64,
                    sha: currentSha,
                    branch: defaultBranch
                })
            });
            if (!putResp.ok) {
                const errText = await putResp.text();
                throw new Error(`Échec PUT (${putResp.status}) : ${errText.slice(0, 100)}`);
            }
            const putData = await putResp.json();
            const newCommitSha = putData.commit.sha;
            addTrackerLog(repo, `Commit injecté : ${newCommitSha.substring(0,7)}`, "success");

            // 7. Vérification finale : relire le fichier et comparer avec l'ancien contenu
            addTrackerLog(repo, "Vérification finale du contenu restauré...", "loading");
            const verifyResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/index.html?ref=${defaultBranch}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!verifyResp.ok) throw new Error("Impossible de vérifier le fichier après rollback");
            const verifyData = await verifyResp.json();
            const newContent = base64ToUtf8(verifyData.content);
            if (newContent !== oldContent) {
                throw new Error("Le contenu restauré ne correspond pas à l'ancienne version !");
            }
            addTrackerLog(repo, "Vérification réussie : le fichier sur GitHub est bien l'ancienne version.", "success");

            // 8. Forcer rebuild GitHub Pages
            addTrackerLog(repo, "Demande de reconstruction forcée à GitHub Pages...", "loading");
            try {
                const rebuildResp = await fetch(`https://api.github.com/repos/${owner}/${repo}/pages/builds`, {
                    method: 'POST',
                    headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' }
                });
                if (rebuildResp.ok) {
                    addTrackerLog(repo, "Rebuild déclenché avec succès (POST /pages/builds)", "success");
                } else if (rebuildResp.status === 404) {
                    addTrackerLog(repo, "GitHub Pages non activé → code restauré mais non publié", "warning");
                } else {
                    addTrackerLog(repo, `Impossible de forcer le rebuild (statut ${rebuildResp.status})`, "warning");
                }
            } catch(e) {
                addTrackerLog(repo, "Le rebuild forcé n'est pas supporté", "warning");
            }

            // 9. Polling (optionnel, mais informatif)
            addTrackerLog(repo, "Surveillance du build GitHub Pages (max 15x5s)...", "loading");
            let deployed = false;
            let attempts = 0;
            const maxAttempts = 15;
            while (!deployed && attempts < maxAttempts) {
                await new Promise(r => setTimeout(r, 5000));
                attempts++;
                addTrackerLog(repo, `Polling build... (${attempts}/${maxAttempts})`, "loading");
                const pagesCheck = await fetch(`https://api.github.com/repos/${owner}/${repo}/pages`, {
                    headers: { 'Authorization': `token ${token}` }
                });
                if (pagesCheck.ok) {
                    const pagesData = await pagesCheck.json();
                    if (pagesData.status === "built") {
                        deployed = true;
                        addTrackerLog(repo, "✅ GitHub Pages a terminé la construction !", "success");
                    } else if (pagesData.status === "building") {
                        addTrackerLog(repo, "Build en cours...", "loading");
                    }
                } else if (pagesCheck.status === 404) {
                    addTrackerLog(repo, "GitHub Pages non activé → pas de déploiement.", "warning");
                    deployed = true;
                }
            }

            const liveUrl = `https://${owner.toLowerCase()}.github.io/${repo}/`;
            const cacheBusterUrl = liveUrl + (liveUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
            if (deployed) {
                addTrackerLog(repo, `🎉 Rollback effectif ! L'état précédent est maintenant en ligne.`, "success");
                addTrackerLog(repo, `🔗 Vérifie avec cache-buster : ${cacheBusterUrl}`, "step");
                addTrackerLog(repo, "👉 Si le site n'a pas changé, fais Ctrl+Shift+R (forcer le rechargement) et attends 2 minutes.", "step");
                showNotification(`Rollback réussi pour ${repo} (état antérieur restauré)`, "success");
            } else {
                addTrackerLog(repo, "⚠️ Le code a été restauré, mais le déploiement GitHub Pages n'a pas été détecté dans le délai.", "warning");
                addTrackerLog(repo, "👉 Attends 2 minutes, puis ouvre : " + cacheBusterUrl, "step");
                showNotification(`Rollback commité mais déploiement lent pour ${repo}`, "warning");
            }
        } catch (err) {
            console.error(err);
            addTrackerLog(repo, `ERREUR : ${err.message}`, "error");
            showNotification(`Rollback échoué : ${err.message}`, "danger");
        } finally {
            setBackButtonState(repo, false);
            setActivityState(false);
        }
    }

    // ---------- AUTRES FONCTIONS ----------
    function showConfirmPanel(repoName) {
        document.getElementById(`confirm-${repoName}`).style.display = 'flex';
    }
    function hideConfirmPanel(repoName) {
        document.getElementById(`confirm-${repoName}`).style.display = 'none';
    }

    async function deleteRepository(owner, repoName) {
        const token = localStorage.getItem('hubcode_token');
        hideConfirmPanel(repoName);
        setActivityState(true, "SUPPRESSION");
        try {
            const resp = await fetch(`https://api.github.com/repos/${owner}/${repoName}`, {
                method: 'DELETE',
                headers: { 'Authorization': `token ${token}` }
            });
            if (resp.status === 204 || resp.status === 240) {
                allRepositories = allRepositories.filter(r => r.name !== repoName);
                const el = document.getElementById(`repo-${repoName}`);
                if (el) el.remove();
                showNotification(`Dépôt ${repoName} supprimé.`, "success");
            } else {
                throw new Error(`Statut ${resp.status} - droits insuffisants`);
            }
        } catch (err) {
            showNotification(err.message, "danger");
        } finally {
            setActivityState(false);
        }
    }

    async function copyGitFile(owner, repo, filename) {
        const token = localStorage.getItem('hubcode_token');
        setActivityState(true, `COPIE ${filename}`);
        try {
            const resp = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filename}`, {
                headers: { 'Authorization': `token ${token}` }
            });
            if (!resp.ok) throw new Error(`${filename} introuvable`);
            const data = await resp.json();
            const content = base64ToUtf8(data.content);
            await navigator.clipboard.writeText(content);
            showNotification(`${filename.toUpperCase()} copié`, "success");
        } catch(err) {
            showNotification(err.message, "danger");
        } finally {
            setActivityState(false);
        }
    }

    function viewLivePage(owner, repo) {
        const url = `https://${owner.toLowerCase()}.github.io/${repo}/?t=${Date.now()}`;
        window.open(url, '_blank');
    }

    function renderRepos(repos) {
        const container = document.getElementById('repoListContainer');
        container.innerHTML = "";
        if (repos.length === 0) {
            container.innerHTML = "<div style='text-align:center; color:#555; padding:20px;'>Aucun dépôt trouvé.</div>";
            return;
        }
        repos.forEach(repo => {
            const div = document.createElement('div');
            div.className = 'repo-item';
            div.id = `repo-${repo.name}`;
            div.innerHTML = `
                <div class="repo-header"><span>${repo.name}</span></div>
                <div class="repo-actions-row">
                    <button class="action-btn btn-html" onclick="playHum60Hz(); copyGitFile('${repo.owner.login}', '${repo.name}', 'index.html')">HTML</button>
                    <button class="action-btn btn-json" onclick="playHum60Hz(); copyGitFile('${repo.owner.login}', '${repo.name}', 'manifest.json')">JSON</button>
                    <button class="action-btn btn-sw" onclick="playHum60Hz(); copyGitFile('${repo.owner.login}', '${repo.name}', 'sw.js')">SW</button>
                    <button class="action-btn btn-view" onclick="playHum60Hz(); viewLivePage('${repo.owner.login}', '${repo.name}')">VIEW</button>
                    <button class="action-btn btn-back" onclick="playHum60Hz(); revertToPreviousCommit('${repo.owner.login}', '${repo.name}', '${repo.default_branch}')">BACK</button>
                    <button class="action-btn btn-sup" onclick="playHum60Hz(); showConfirmPanel('${repo.name}')">SUP</button>
                </div>
                <div class="confirm-panel" id="confirm-${repo.name}">
                    <span style="color:var(--danger);">Supprimer définitivement ${repo.name} ?</span>
                    <div class="confirm-buttons">
                        <button class="confirm-btn" style="background:#f85149; color:white;" onclick="playHum60Hz(); deleteRepository('${repo.owner.login}', '${repo.name}')">CONFIRMER</button>
                        <button class="confirm-btn" style="background:#444; color:white;" onclick="playHum60Hz(); hideConfirmPanel('${repo.name}')">ANNULER</button>
                    </div>
                </div>
                <div class="tracker-terminal" id="tracker-${repo.name}">
                    <div class="tracker-header"><span>⛁ ROLLBACK LOGS</span><span>⚡ temps réel</span></div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(e => console.log("SW not available")));
    }
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));}</script>
</body>
